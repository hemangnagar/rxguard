[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rxguard"
version = "0.1.0"
description = "Evidence-first pharmacy margin and exception analysis using synthetic, standards-based data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "fhir.resources>=8.3,<9",
]

[project.optional-dependencies]
ai = ["anthropic>=0.69,<1"]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "cyclonedx-bom>=5,<7"]

[tool.setuptools]
packages = ["rxguard"]

[tool.setuptools.package-data]
rxguard = ["scenarios/*.json", "standards/*.json", "../web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

